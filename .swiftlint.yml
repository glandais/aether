# Configuration SwiftLint — lancée par scripts/verify.sh (en mode --strict :
# tout avertissement bloque). Voir https://realm.github.io/SwiftLint
included:
  - Aether
  - Tests
excluded:
  - build
  - .build
  - Aether.xcodeproj

# Code scientifique (astro/Meeus) et graphique (vecteurs, raymarching) : les
# identifiants mathématiques courts (i, c, d, t, ra, up…) sont idiomatiques.
# On garde les autres garde-fous (casse, noms réservés), on lève le minimum.
identifier_name:
  min_length:
    warning: 1
    error: 0

# Le moteur Metal (Renderer.swift) est volontairement un fichier dense et
# cohésif (boucles de rendu, structures miroir des uniformes). On assouplit les
# métriques de taille en conséquence, tout en gardant un plafond qui signale
# une vraie dérive ailleurs dans la base.
file_length:
  warning: 1300
  error: 1600
type_body_length:
  warning: 800
  error: 1000
function_body_length:
  warning: 200
  error: 300
cyclomatic_complexity:
  warning: 15
  error: 25
function_parameter_count:
  warning: 7
  error: 9
large_tuple:
  warning: 3
  error: 4
