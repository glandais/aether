name: Aether

options:
  bundleIdPrefix: io.github.glandais
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Réglages partagés par toutes les cibles — Swift 6 strict + signature.
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Signature automatique avec l'équipe « GABRIEL JEAN YVES ANNE LANDAIS ».
    DEVELOPMENT_TEAM: "7Q49262697"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: fr
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  SwiftAA:
    url: https://github.com/onekiloparsec/SwiftAA
    from: "3.0.1"

targets:
  Aether:
    type: application
    platform: iOS
    sources:
      - path: Aether
    dependencies:
      - package: SwiftAA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.glandais.aether
        PRODUCT_NAME: Aether
        CODE_SIGN_ENTITLEMENTS: Aether/Aether.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # Lancement plein écran sans launch storyboard (étape 1).
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Aether
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        # Descriptions d'usage — registre sobre. Capabilities réelles (WeatherKit,
        # Location, Photos) activées aux étapes 8/9 du pipeline.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Aether utilise votre position pour orienter le ciel : soleil, lune et lumière du lieu choisi."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Aether lit vos photos pour peindre des nuages au-dessus de vos propres paysages."

  AetherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AetherTests
    dependencies:
      - target: Aether
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.glandais.aether.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Aether:
    build:
      targets:
        Aether: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AetherTests
